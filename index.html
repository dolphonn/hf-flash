<style>
:root{

html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;}

body.light{

  --text:#0b1220;--muted:#5b6472;
  --glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.72);
  --brd:rgba(255,255,255,.7);--shadow:0 18px 40px rgba(30,27,75,.16);
  --blobA:rgba(99,102,241,.5);--blobB:rgba(14,165,233,.45);--blobC:rgba(236,72,153,.35);
}
body.dark{
  --bg1:#0a0f1f;--bg2:#0e1730;--bg3:#1b1740;
  --text:#e8ecf6;--muted:#9aa4bb;
  --glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.10);
  --brd:rgba(255,255,255,.16);--shadow:0 18px 44px rgba(0,0,0,.5);
  --blobA:rgba(99,102,241,.35);--blobB:rgba(56,189,248,.28);--blobC:rgba(217,70,239,.22);
}
.bg{position:fixed;inset:0;z-index:0;background:linear-gradient(160deg,var(--bg1),var(--bg2) 48%,var(--bg3));overflow:hidden;}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.9;will-change:transform;}
.b1{width:60vmax;height:60vmax;background:var(--blobA);top:-20vmax;left:-18vmax;animation:float1 18s ease-in-out infinite;}
.b2{width:55vmax;height:55vmax;background:var(--blobB);bottom:-22vmax;right:-16vmax;animation:float2 22s ease-in-out infinite;}
.b3{width:40vmax;height:40vmax;background:var(--blobC);top:40%;left:55%;animation:float3 26s ease-in-out infinite;}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(8vmax,6vmax) scale(1.1)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-7vmax,-5vmax) scale(1.08)}}
@keyframes float3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-5vmax,4vmax) scale(.92)}}
.screen{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}

.badge{flex:none;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 18px rgba(79,70,229,.4);}
.row .info{flex:1;min-width:0;}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,16px);z-index:50;padding:12px 22px;border-radius:99px;background:var(--glass2);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid var(--brd);box-shadow:var(--shadow);color:var(--text);font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s ease;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.face.front{text-align:center;}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;padding:26px 24px;display:flex;flex-direction:column;background:var(--glass2);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--brd);box-shadow:var(--shadow);}
.face.back{transform:rotateY(180deg);}
.ref{align-self:flex-start;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:#fff;padding:6px 12px;border-radius:99px;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-bottom:16px;}
.q{font-size:20px;font-weight:700;line-height:1.4;flex:1;display:flex;align-items:center;}
.a{white-space:pre-line;font-size:16px;line-height:1.55;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:4px;}
.hint{margin-top:14px;text-align:center;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;}
.swipe-hint{text-align:center;color:var(--muted);font-size:12px;padding-bottom:calc(8px + env(safe-area-inset-bottom));}

<script>
var DATA=[];
DATA.push(
{r:"46.2",t:"AIRMANSHIP, PROFESSIONALISM AND RESPONSIBILITY",s:"Subject 46 · Human Factors",cards:[
   {r:"46.2.2",q:"Define professionalism.",a:"Professionalism in aviation is the consistent adherence to safety standards, high technical competence, ethical discipline, continuous self-improvement, and sound judgment under all operational conditions."},
   {r:"46.2.4",q:"Distinguish between piloting for personal reasons and for hire or reward.",a:"Personal flying focuses on individual enjoyment and self-determined risk tolerance within legal bounds. Flying for hire or reward imposes a higher duty of care, regulatory oversight, commercial accountability, and strict adherence to organizational Standard Operating Procedures (SOPs)."},
   {r:"46.2.6",q:"Distinguish between safety, effectiveness and efficiency in terms of pilot responsibilities.",a:"Safety: The absolute top priority; freedom from unacceptable risk or harm. Effectiveness: Achieving the mission objective successfully (e.g., reaching destination safely). Efficiency: Optimizing time, fuel, and cost without ever compromising safety or effectiveness."},
   {r:"46.2.8",q:"List the people to whom a pilot is responsible in carrying out his or her duties.",a:"Passengers, flight and cabin crew, airline management and employer, civil aviation authorities (NZ CAA), ground personnel, air traffic control, and the general public."},
   {r:"46.2.10",q:"List the people to whom a co-pilot is responsible in carrying out his or her duties.",a:"The Pilot in Command (PIC), company management, regulatory authorities (NZ CAA), cabin crew, and passengers."},
   {r:"46.2.12",q:"Describe key features of good and safe airmanship.",a:"Thorough pre-flight planning, continuous situational awareness, proactive risk and threat management, effective communication, strict SOP adherence, personal discipline, and sound decision-making."}
  ]},
{r:"46.4",t:"HUMAN FACTORS MODELS AND PROGRAMMES",s:"Subject 46 · Human Factors",cards:[
   {r:"46.4.2",q:"Define human factors as used in a professional aviation context.",a:"The multidisciplinary science studying human capabilities, limitations, and behaviors to optimize safety, efficiency, and human interaction within aviation systems."},
   {r:"46.4.4",q:"Describe the fundamentals of the SHELL Model in relation to the interaction of humans with other humans, hardware, information sources, and the environment.",a:"The SHELL model places Liveware (the human at the center) and evaluates interactions with: Liveware-Liveware (L-L): Crew communication, teamwork, leadership. Liveware-Hardware (L-H): Ergonomics, controls, displays, cockpit layout. Liveware-Software (L-S): Standard Operating Procedures, manuals, checklists, software. Liveware-Environment (L-E): Weather, cabin pressure, noise, organizational culture."},
   {r:"46.4.6",q:"Explain the role of human factors programmes in promoting aviation safety in flight operations requiring an ATPL.",a:"Human factors programmes reduce human error, enhance Crew Resource Management (CRM), improve system design, foster a Just Culture, and build systemic resilience in complex multi-crew environments."}
  ]},
{r:"46.6",t:"THE ATMOSPHERE",s:"Subject 46 · Human Factors",cards:[
   {r:"46.6.2",q:"Describe the variation of pressure as altitude increases.",a:"Atmospheric pressure decreases exponentially with increasing altitude. Standard lapse rate near sea level is approximately 1 hPa per 30 feet (or 1 inch Hg per 1,000 feet)."},
   {r:"46.6.4",q:"Explain how the partial pressure of oxygen changes as altitude increases.",a:"While the fraction of oxygen in air remains constant at approximately 21%, the total atmospheric pressure decreases with altitude, causing the partial pressure of oxygen (PO2) to drop proportionally."}
  ]},
{r:"46.8",t:"CIRCULATION AND RESPIRATORY SYSTEMS",s:"Subject 46 · Human Factors",cards:[
   {r:"46.8.2",q:"Describe the physiology of the respiratory system.",a:"Air enters through the nose/mouth, travels down the trachea and bronchi into the alveoli of the lungs. Oxygen diffuses across alveolar membranes into capillary blood, while carbon dioxide diffuses from blood into alveoli to be exhaled. Gas exchange relies on partial pressure gradients."},
   {r:"46.8.4",q:"Describe the physiology of the circulatory system.",a:"The heart acts as a double pump. The right side pumps deoxygenated blood to the lungs (pulmonary circulation) for gas exchange. The left side pumps oxygen-rich blood through arteries to tissues (systemic circulation). Veins return carbon dioxide and metabolic waste to the heart."}
  ]},
{r:"46.10",t:"HYPOXIA",s:"Subject 46 · Human Factors",cards:[
   {r:"46.10.2",q:"State the partial pressure of oxygen both inside and outside the lungs at sea level.",a:"Outside the lungs (ambient air): ~160 mmHg. Inside the alveoli (alveolar air): ~104 mmHg."},
   {r:"46.10.4",q:"Explain the mechanical effect of the partial pressure of oxygen on oxygen transfer in the lungs.",a:"Gas transfer depends on diffusion down a pressure gradient. High PO2 in alveolar air forces oxygen across the alveolar-capillary membrane into red blood cells, binding with hemoglobin."},
   {r:"46.10.6",q:"Explain the causes of hypoxia.",a:"Hypoxia is caused by reduced PO2 at altitude (Hypoxic), reduced oxygen-carrying capacity of blood (Hypemic), insufficient tissue blood flow (Stagnant), or cellular poisoning preventing oxygen uptake (Histotoxic)."},
   {r:"46.10.8",q:"Describe the primary physiological and behavioural consequences of hypoxia for flight crew and passengers.",a:"Physiological: Cyanosis, increased heart rate, hyperventilation, tunnel vision, loss of consciousness. Behavioral: Euphoria, impaired judgment, slowed reaction time, loss of self-criticism, confusion, total incapacitation."},
   {r:"46.10.10",q:"Describe the common symptoms of hypoxia.",a:"Headache, dizziness, tingling in extremities, cyanosis (blue lips/fingernails), impaired vision, mental confusion, euphoria, fatigue, and poor coordination."},
   {r:"46.10.12",q:"Explain the reasons hypoxia symptoms are difficult to detect.",a:"Hypoxia impairs the brain first, destroying self-monitoring ability, critical judgment, and insight. It often produces a false sense of well-being (euphoria)."},
   {r:"46.10.14",q:"Explain the relationship between hypoxic onset and both vision and cognitive performance.",a:"Night vision degrades at altitudes as low as 4,000 to 5,000 feet. Cognitive performance (reasoning, memory, decision-making) degrades significantly above 10,000 feet."},
   {r:"46.10.16",q:"Describe how hypoxia can be prevented.",a:"Maintain cabin pressurization, use supplemental oxygen above recommended/statutory altitudes, avoid smoking/alcohol/illness, and maintain good physical fitness."},
   {r:"46.10.18",q:"List the main factors influencing variation in hypoxia onset (tolerance) between individuals.",a:"Physical fitness, altitude/rate of ascent, smoking status, alcohol/medication consumption, temperature, fatigue, and individual physiological differences."},
   {r:"46.10.20",q:"State the factors that affect the likelihood of suffering from hypoxia.",a:"Altitude level, rate of ascent, duration at altitude, physical exertion, ambient temperature, smoking, fatigue, and medical condition."},
   {r:"46.10.22",q:"Describe how hypoxia can be treated.",a:"Administer 100% supplemental oxygen immediately under pressure if required, descend rapidly to a safe altitude (below 10,000 feet), and check oxygen equipment connections."},
   {r:"46.10.24",q:"Define the concept of 'time of useful consciousness'.",a:"Time of Useful Consciousness (TUC) is the period from exposure to an oxygen-deficient environment until purposeful deliberate physical and mental activity is no longer possible."},
   {r:"46.10.26",q:"State the approximate time of useful consciousness at: (a) 18,000ft (b) 25,000ft (c) 35,000ft.",a:"18,000 ft: 20 to 30 minutes. 25,000 ft: 3 to 5 minutes. 35,000 ft: 30 to 60 seconds."},
   {r:"46.10.28",q:"Explain oxygen paradox.",a:"A temporary worsening of symptoms or sudden temporary loss of consciousness immediately after breathing 100% oxygen following a period of hypoxia, caused by sudden vasodilation in the brain."},
   {r:"46.10.30",q:"Describe the primary physiological effects of cabin pressurization loss at altitudes of 25,000ft and above.",a:"Rapid onset of hypoxia, severe drop in TUC (halved in explosive decompression), expansion of trapped body gases, decompression sickness, and severe cold exposure."},
   {r:"46.10.32",q:"List the key safety critical actions flight crew must take in the event of a high altitude cabin pressurization failure.",a:"1. Don oxygen masks immediately and select 100% oxygen. 2. Establish flight crew communications. 3. Initiate an emergency descent to safe altitude."},
   {r:"46.10.34",q:"Identify the principal features of supplemental oxygen systems use to assist aircrew and passengers in the event of an in-flight pressurisation emergency.",a:"Flight crew use quick-donning, pressure-demand oxygen masks. Passengers receive oxygen from chemical generators or central cylinder storage via automatic drop-down continuous-flow masks."}
  ]},
{r:"46.12",t:"HYPERVENTILATION",s:"Subject 46 · Human Factors",cards:[
   {r:"46.12.2",q:"Describe the symptoms of hyperventilation.",a:"Dizziness, lightheadedness, tingling in hands/feet/lips (paresthesia), muscle spasms (carpopedal spasm), rapid breathing, visual disturbances, anxiety, and eventual loss of consciousness."},
   {r:"46.12.4",q:"Describe how hyperventilation can be treated.",a:"Regulate breathing deliberately (slow, deep breaths), talk aloud to control breathing rate, or breathe into a paper bag to re-inhale carbon dioxide."}
  ]},
{r:"46.14",t:"ENTRAPPED GASSES",s:"Subject 46 · Human Factors",cards:[
   {r:"46.14.2",q:"Explain the causes of barotrauma.",a:"Boyle's Law: As ambient atmospheric pressure decreases during ascent (or increases during descent), trapped gas in body cavities expands or contracts, causing severe tissue damage or pain if trapped."},
   {r:"46.14.4",q:"Describe the symptoms of barotrauma.",a:"Sharp, severe pain in ears, sinuses, teeth, or abdomen; feeling of fullness in ears; temporary hearing loss; vertigo; ear drum rupture in extreme cases."},
   {r:"46.14.6",q:"Describe the effects of barotrauma on various parts of the body.",a:"Middle Ear: Ear block, severe pain, drum perforation. Sinuses: Sinus block, severe facial/forehead pain. Teeth (Barodontalgia): Sharp pain under faulty fillings or abscesses. GI Tract: Abdominal cramps and severe bloating during ascent."},
   {r:"46.14.8",q:"Describe how barotrauma can be prevented.",a:"Do not fly with colds, congestion, or sinus infections. Avoid gas-producing foods before flying. Maintain regular dental care. Descend at manageable rates."},
   {r:"46.14.10",q:"Describe how barotrauma can be treated.",a:"Valsalva maneuver (during descent), swallowing, yawning, or chewing. If severe during descent, stop descent, climb back to equalise pressure, and descend slowly. Use nasal decongestant sprays prior to flight if mild."}
  ]},
{r:"46.16",t:"DECOMPRESSION SICKNESS",s:"Subject 46 · Human Factors",cards:[
   {r:"46.16.2",q:"Explain the causes of decompression sickness.",a:"Henry's Law: Nitrogen dissolved in body tissues at high ambient pressures comes out of solution and forms bubbles when ambient pressure drops rapidly, such as in decompression or high-altitude flight."},
   {r:"46.16.4",q:"Describe the symptoms of decompression sickness.",a:"Bends: Joint pain (elbows, knees, shoulders). Skin (Creeps): Itching, tingling, mottled rash. Chokes: Chest pain, dry cough, shortness of breath. CNS (Staggers): Confusion, paralysis, visual loss, seizures."},
   {r:"46.16.6",q:"Explain how decompression sickness can be prevented.",a:"Maintain cabin pressurization, avoid rapid high-altitude climbs, observe mandatory surface waiting times after scuba diving before flying, and pre-oxygenate with 100% oxygen when flying unpressurized at high altitude."},
   {r:"46.16.8",q:"Describe how decompression sickness can be treated.",a:"Administer 100% oxygen immediately, perform an emergency descent to ground level/lowest altitude, land as soon as practical, seek hyperbaric recompression chamber treatment."},
   {r:"46.16.10",q:"Explain the effects of an explosive decompression on the body.",a:"Forceful lung exhalation, potential lung barotrauma/arterial gas embolism if breath held, rapid hypoxia onset (TUC reduced by ~50%), sudden cold, fogging due to condensation, trapped gas expansion."},
   {r:"46.16.12",q:"Explain the actions that must be taken to deal with an explosive decompression.",a:"Don oxygen mask immediately (100% pressure demand), establish crew communications, initiate emergency descent, control aircraft, notify ATC."},
   {r:"46.16.14",q:"Explain the dangers of flying after diving.",a:"Scuba diving increases nitrogen dissolved in tissues under hyperbaric water pressure. Flying shortly afterward drops ambient pressure, triggering severe decompression sickness at much lower altitudes than normal."},
   {r:"46.16.16",q:"State the approximate required times between diving at various depths and flying.",a:"Non-decompression stop diving (<4 hours total time): Wait 12 hours minimum. Multiple dives/Decompression stop required: Wait 18 to 24 hours minimum. NZ CAA / FAA / DAN standard: 12 hours for single no-decompression dive; 18-24 hours for repetitive or decompression dives."}
  ]},
{r:"46.18",t:"VISION AND VISUAL PERCEPTION",s:"Subject 46 · Human Factors",cards:[
   {r:"46.18.2",q:"Describe methods of avoiding and/or coping with the:",a:"(a) stroboscopic illumination illusion/flicker vertigo: Turn off or obscure flashing lights, look away from rotating propeller/strobe light reflection in clouds.\n\n(b) break-off phenomenon: Focus on cockpit instruments, re-engage in active flying tasks, maintain interaction with co-pilot.\n\n(c) sector whiteout: Rely strictly on instrument flight references, avoid visual flight in uniform white conditions, initiate climb/go-around if visual references lost.\n\n(d) black hole phenomenon: Use instrument approach guidance (ILS/VNAV/GLS), strictly monitor glidepath and altimeter, avoid relying solely on visual cues on dark approaches over unlit terrain/water."}
  ]},
{r:"46.20",t:"HEARING AND BALANCE",s:"Subject 46 · Human Factors",cards:[
   {r:"46.20.2",q:"Describe the effect of prolonged noise exposure on hearing.",a:"Causes damage to fine hair cells (cilia) in the cochlea, leading to Sensorineural Hearing Loss, permanently reducing hearing sensitivity, particularly at high frequencies (4000 Hz notch)."},
   {r:"46.20.4",q:"Describe methods of protecting hearing.",a:"Use active noise-cancelling (ANC) headsets, well-fitted earplugs, external ear defenders, and minimize exposure duration to high noise environments."},
   {r:"46.20.6",q:"Specify the various levels of noise in decibels at which various grades of hearing protection are required.",a:"85 dB(A): Action threshold; hearing protection recommended/provided for 8-hour exposure. 90 dB(A)+: Mandatory hearing protection required. 115 dB(A)+: High-grade double protection (earplugs + ear defenders) recommended."},
   {r:"46.20.8",q:"Specify noise levels at which hearing damage may occur.",a:"Sustained exposure above 85 dB(A) causes gradual permanent hearing loss; single exposure above 140 dB(A) causes immediate acoustic trauma."},
   {r:"46.20.10",q:"Describe what is meant by the action threshold for hearing protection.",a:"The exposure level (85 dB(A) over an 8-hour time-weighted average) where an employer/operator must provide information, testing, and noise protection gear to prevent hearing loss."},
   {r:"46.20.12",q:"Explain the effects of age induced hearing loss (presbycusis).",a:"Gradual, irreversible, age-related sensorineural hearing loss occurring in both ears equally, primarily affecting perception of high-frequency sounds, making speech perception in noisy environments difficult."}
  ]},
{r:"46.30",t:"FLYING AND HEALTH (FITNESS TO FLY)",s:"Subject 46 · Human Factors",cards:[
   {r:"46.30.2",q:"Explain the responsibilities of pilots towards medical fitness for flight.",a:"Pilots have a legal duty under Civil Aviation Rules (CAR Part 67) to self-assess fitness before every flight (IMSAFE check) and must not fly if they suffer any medical condition or take medication likely to impair flight safety."},
   {r:"46.30.4",q:"Describe the problems associated with pregnancy and flying.",a:"Morning sickness, fatigue, increased risk of deep vein thrombosis (DVT), hypoxia risk to fetus, rapid changes in blood pressure, movement restriction, and potential emergency complications."},
   {r:"46.30.6",q:"State when a pregnant pilot must stop flying.",a:"Under NZ CAA rules, female pilots must inform their ME/CAA and cease operational flying at the end of the 26th week of gestation (or earlier if complications arise)."},
   {r:"46.30.8",q:"Describe effects on pilot performance and methods to minimize/manage:",a:"(a) arterial disease: Risk of heart attack/stroke; manage via diet, low cholesterol, exercise, blood pressure control.\n\n(b) blood pressure: High BP risks cardiovascular events; low BP risks syncope; manage with lifestyle, diet, approved medications.\n\n(c) diet: Balanced meals maintain glucose stability; avoid high-fat meals.\n\n(d) exercise: Improves cardiovascular health, stamina, stress tolerance, and sleep quality.\n\n(e) obesity: Increases fatigue, OSA risk, cardiovascular risk; manage through calorie balance and exercise.\n\n(f) smoking: Carbon monoxide reduces oxygen capacity (5-10% hypemic hypoxia equivalent), damages lungs/heart; quit smoking.\n\n(g) respiratory tract infection/allergies: Risk of severe barotrauma, ear block, incapacitation; ground self until fully recovered.\n\n(h) food poisoning/gastroenteritis: Severe incapacitation, dehydration, fatigue; ground self, eat separate crew meals.\n\n(i) neurological factors: Seizures, blackouts, migraines cause immediate disqualification/incapacitation; seek medical check.\n\n(j) emotional factors: Depression/anxiety impair cognition, memory, and attention; seek support, ground self.\n\n(k) psychiatric diseases: Compromise safety critical decision-making; immediate medical disqualification. (l) physical injuries: Impair control movement, mobility, focus; ground self until certified fit. (m) dehydration: Causes fatigue, headaches, dizziness, reduced concentration; drink water regularly. (n) hypoglycaemia: Low blood sugar causes weakness, tremors, confusion, irritability; maintain regular balanced meals."},
   {r:"46.30.10",q:"Describe the symptoms of gastrointestinal problems.",a:"Nausea, vomiting, abdominal cramps, diarrhea, fever, dehydration, dizziness, and sudden operational incapacitation."},
   {r:"46.30.12",q:"Identify the primary causes of food poisoning.",a:"Ingestion of food contaminated with bacteria (e.g., Salmonella, E. coli, Staph), toxins, parasites, or viral agents due to improper handling, cooking, or storage."}
  ]},
{r:"46.32",t:"ALCOHOL AND DRUGS",s:"Subject 46 · Human Factors",cards:[
   {r:"46.32.2",q:"Explain the effects of alcohol on pilot performance.",a:"Degrades judgment, spatial orientation, reaction time, motor control, visual acuity, sleep quality, and hypoxia tolerance."},
   {r:"46.32.4",q:"Explain the restriction associated with the consumption of alcohol and flying.",a:"NZ CAR Part 91 / Civil Aviation Act rules: Minimum 9-12 hours \"bottle to throttle\" (many airline SOPs require 12-24 hours), maximum legal blood alcohol limit is extremely low (0.02% or zero tolerance). Must not fly under influence or hungover."},
   {r:"46.32.6",q:"Describe how individuals differ in the effect of alcohol consumption.",a:"Body mass, gender, liver metabolism rate, recent food intake, fatigue level, age, and tolerance alter blood alcohol concentration (BAC) and degradation rate. Average elimination is ~15 mg/100ml per hour (~1 standard drink/hr)."},
   {r:"46.32.8",q:"Explain the effects of drugs on pilot performance.",a:"Prescription, over-the-counter, or illicit drugs can cause drowsiness, impaired judgment, delayed reaction time, visual disturbance, or sudden side effects."},
   {r:"46.32.10",q:"Explain why illegal/recreational drugs are unacceptable for pilots.",a:"Unpredictable effects, severe cognitive and psychomotor degradation, long hangover periods, risk of sudden incapacitation, illegality, and incompatibility with professional duties."}
  ]},
{r:"46.36",t:"ENVIRONMENTAL HAZARDS",s:"Subject 46 · Human Factors",cards:[
   {r:"46.36.2",q:"Describe symptoms, effects, and immediate treatments for environmental hazards:",a:"(a) Carbon monoxide: Symptoms: Headache, tightness in temples, nausea, dim vision, confusion. Effect: Hypemic hypoxia (binds hemoglobin 200x stronger than O2). Treatment: 100% oxygen, land immediately, fresh air.\n\n(b) Fuel: Symptoms: Skin irritation, eye burning, nausea from fumes. Effect: Central nervous system depression, toxicity. Treatment: Flush skin/eyes with water, move to fresh air.\n\n(c) Chemical sprays: Symptoms: Nausea, twitching, difficulty breathing, pinpoint pupils. Effect: Systemic poisoning. Treatment: Remove contaminated clothing, wash skin, seek immediate medical aid.\n\n(d) Lubricating oils: Symptoms: Eye/throat irritation, mist inhalation headaches. Effect: Toxicity, thermal degradation toxic fumes (TCP). Treatment: Fresh air, wash exposed area.\n\n(e) Hydraulic fluids: Symptoms: Eye damage, skin burn, high-pressure injection injury. Effect: Severe tissue toxicity. Treatment: Immediate medical flushing, urgent surgical consult for injection.\n\n(f) Compressed gases: Symptoms: Frostbite, barotrauma exposure. Effect: Asphyxiation in confined spaces. Treatment: Move to fresh air, treat burns/frostbite.\n\n(g) Liquid oxygen: Symptoms: Severe cold burns, tissue destruction. Effect: Extreme fire hazard, cold injury. Treatment: Flush with tepid water, do not rub skin.\n\n(h) De-icing fluids: Symptoms: Eye irritation, dizziness if inhaled heated mists. Effect: Mild central nervous system toxicity. Treatment: Rinse eyes with water, fresh air.\n\n(i) Fire extinguishing agents: Symptoms: Coughing, eye irritation, suffocation risk (Halon/CO2). Effect: Oxygen displacement, toxicity. Treatment: Don oxygen mask, ventilate area.\n\n(j) Fire accelerant substances: Symptoms: Burns, respiratory tract injury from heat/fumes. Effect: Severe burns and systemic toxicity. Treatment: Remove from source, cool burns, 100% oxygen.\n\n(k) Ozone: Symptoms: Irritation of eyes/throat, dry cough, chest pain at high altitude (>30,000 ft). Effect: Respiratory tract damage. Treatment: Descend to lower altitude, use catalytic converters. (l) Solar radiation: Symptoms: Long-term eye/skin damage, elevated cancer risk. Effect: DNA damage at high altitude. Treatment: Sunscreen, UV-blocking sunglasses, flight planning."}
  ]},
{r:"46.38",t:"STRESS MANAGEMENT",s:"Subject 46 · Human Factors",cards:[
   {r:"46.38.2",q:"Identify and give examples of physical, environmental, task-related, organisational and psychological stressors.",a:"Physical: Pain, hunger, lack of sleep, illness. Environmental: Noise, vibration, extreme heat/cold, turbulence. Task-related: High workload, emergency procedures, complex approach, system failure. Organisational: Rostering, company pressure, job security, rules. Psychological: Family issues, financial worries, marital problems, grief."},
   {r:"46.38.4",q:"Explain methods of identifying stress.",a:"Self-monitoring (IMSAFE), observing changes in pulse/sweating/breathing, noticing cognitive fatigue, irritability, mood swings, error frequency, and team feedback."},
   {r:"46.38.6",q:"Describe the effects of stress on attention, motivation and performance.",a:"Yerkes-Dodson Law: Low stress leads to boredom and poor performance. Optimal stress enhances focus. High stress causes funneling of attention (tunnel vision), hyper-vigilance, loss of situational awareness, regression to early habits, and performance breakdown."},
   {r:"46.38.8",q:"Explain methods of managing stress.",a:"Long-term: Regular exercise, healthy diet, adequate sleep, lifestyle balance, counselling. Short-term/Cockpit: Deep breathing, task prioritization (Aviate, Navigate, Communicate), clear crew communication, workload sharing."}
  ]},
{r:"46.40",t:"SLEEP AND FATIGUE (ALERTNESS MANAGEMENT)",s:"Subject 46 · Human Factors",cards:[
   {r:"46.40.2",q:"Describe the stages of sleep.",a:"Non-REM Stage 1: Light sleep, transitioning from wakefulness. Non-REM Stage 2: Light sleep, body temperature drops, brain waves slow. Non-REM Stage 3/4 (Slow Wave Sleep): Deep physical recovery, tissue repair. REM (Rapid Eye Movement) Sleep: Dreaming, cognitive consolidation, emotional recovery. Complete cycle takes ~90 minutes."},
   {r:"46.40.4",q:"Describe the mechanism of sleep regulation.",a:"Regulated by two processes: Process S (homeostatic sleep pressure building with time awake) and Process C (circadian rhythm controlled by the suprachiasmatic nucleus)."},
   {r:"46.40.6",q:"Describe problems associated with sleep at abnormal times of the day.",a:"Daytime sleep is lighter, shorter, easily fragmented by noise/light, lacks sufficient Slow Wave/REM balance due to elevated circadian temperature and cortisol levels."},
   {r:"46.40.8",q:"Explain what is meant by sleep debt.",a:"The cumulative difference between the amount of sleep an individual needs and the amount actually obtained over a period of days."},
   {r:"46.40.10",q:"Describe what is meant by sleep inertia, when it is most likely to occur and how long it takes to wear off.",a:"A state of grogginess, impaired performance, and disorientation immediately after waking. Most severe when woken from deep Slow Wave Sleep (Stage 3/4). Lasts 15-30 minutes normally, up to an hour or more in severe cases."},
   {r:"46.40.12",q:"Explain the effects of the following alertness management techniques:",a:"(a) napping: Restores alertness, reduces sleep pressure; best kept under 20-30 minutes to avoid sleep inertia or 90 minutes for a full cycle.\n\n(b) caffeine consumption: Blocks adenosine receptors, temporarily increases alertness; can disrupt subsequent sleep if taken near bedtime.\n\n(c) taking sedatives: May assist short-term sleep initiation; distorts sleep architecture (reduces REM/SWS), carries risk of hangover effects and dependence.\n\n(d) taking stimulants other than caffeine: Amphetamines/Modafinil mask fatigue temporarily, cause high rebound fatigue, heart strain, dependency; strictly restricted in aviation."},
   {r:"46.40.14",q:"Describe methods of managing fatigue.",a:"Proper sleep hygiene (dark, quiet, cool room), operational controlled napping, effective rostering, staying hydrated, caffeine timing, and utilizing Fatigue Risk Management Systems (FRMS)."},
   {r:"46.40.16",q:"Define the following terms:",a:"(a) biological clock: Internal neural mechanism (suprachiasmatic nucleus) regulating 24-hour physiological cycles.\n\n(b) circadian rhythm: Biological cycle lasting approximately 24 hours (body temp, hormones, sleep/wake).\n\n(c) circadian dysrhythmia: Disturbance of normal 24-hour biological rhythm (e.g., jet lag).\n\n(d) desynchronisation: Misalignment between internal biological clock and external environment/local time.\n\n(e) zeitgeber: External environmental cues synchronizing the biological clock (e.g., sunlight, meal times)."},
   {r:"46.40.18",q:"Describe the central human physiological processes underlying circadian rhythm processes.",a:"The Suprachiasmatic Nucleus (SCN) in the hypothalamus receives light signals from retina, regulating melatonin secretion by the pineal gland, controlling core body temperature, alertness, and hormone release."},
   {r:"46.40.20",q:"Explain how circadian rhythms affect pilot performance.",a:"Performance peaks during late afternoon and drops to its lowest point during the Window of Circadian Low (WOCL, typically 0200-0600), increasing reaction time, errors, and fatigue risk."},
   {r:"46.40.22",q:"Explain the effects of circadian dysrhythmia and methods of managing these.",a:"Effects: Fatigue, insomnia, GI upset, concentration loss, reduced performance. Management: Adapt quickly to destination time, use strategic light exposure, plan sleep, stay hydrated."},
   {r:"46.40.24",q:"Describe the rate of adjustment of crossing time zones, in easterly and westerly directions.",a:"Westerly travel (lengthens day): ~1.0 to 1.5 days per time zone crossed. Easterly travel (shortens day): ~1.5 to 2.0 days per time zone crossed."},
   {r:"46.40.26",q:"Explain why the rate of time zone adjustment varies between easterly and westerly directions.",a:"The human circadian clock has a natural internal periodicity slightly longer than 24 hours (~24.2 - 24.5 hours), making it easier to delay the sleep cycle (westward) than advance it (eastward)."},
   {r:"46.40.28",q:"Describe the impact of shiftwork on a pilot performance.",a:"Causes circadian disruption, sleep deprivation, cumulative fatigue, reduced reaction time, diminished vigilance, and higher error rates."},
   {r:"46.40.30",q:"Describe how the biological effects of shiftwork can be minimised.",a:"Forward-rotating shift schedules (day -> evening -> night), maximizing sleep hygiene, strategic light control, short naps, and predictable rostering patterns."},
   {r:"46.40.32",q:"Identify the principles of good rostering practice.",a:"Predictable flight schedules, adequate rest periods between shifts, avoiding rapid rotation changes, minimizing consecutive night flights, and aligning with FRMS guidelines."}
  ]},
{r:"46.42",t:"AGEING",s:"Subject 46 · Human Factors",cards:[
   {r:"46.42.2",q:"Describe the effects of the normal processes of human ageing on:",a:"(a) sensory systems: Reduced visual acuity, presbyopia, night vision loss, presbycusis (hearing loss).\n\n(b) muscular strength: Gradual loss of muscle mass and physical strength.\n\n(c) resilience and reaction times: Slower motor and mental reaction time, longer recovery from fatigue.\n\n(d) sleep/wakefulness patterns: Sleep becomes lighter, more fragmented, with less deep Slow Wave sleep.\n\n(e) cognitive or mental functioning: Slower processing speed, reduced fluid intelligence, stable/improved crystallized intelligence.\n\n(f) acquisition of new information: Slower encoding and learning of complex new automated systems.\n\n(g) retention and retrieval: Slight reduction in working memory retrieval speed; long-term memory remains intact.\n\n(h) rate of information processing: Reduced processing speed under high-workload/time-pressured conditions.\n\n(i) insight and self-awareness: Generally superior due to experience, compensating for physical decline."},
   {r:"46.42.4",q:"Describe methods by which age-related changes in memory and speed of information processing can be moderated by older pilots.",a:"Relying on experience, anticipating situations early, using standard checklists, structured planning, maintaining physical fitness, and engaging in continuous practice."},
   {r:"46.42.6",q:"Describe what changes would indicate early dementia or age related cognitive impairment in another pilot.",a:"Memory loss disrupting daily tasks, confusion with familiar procedures, difficulty completing routine tasks, disorientation to time/place, poor judgment, social withdrawal, or sudden personality changes."}
  ]},
{r:"46.44",t:"INFORMATION PROCESSING",s:"Subject 46 · Human Factors",cards:[
   {r:"46.44.2",q:"Describe the brain's role in registering sensations, processing sensory information, storing information and controlling actions.",a:"Sensory receptors send signals to specific brain cortex areas for interpretation; the brain filters signals, compares them with stored memories, makes decisions, and sends motor commands via nerves to muscles."},
   {r:"46.44.4",q:"Describe a basic model of information processing, including concepts:",a:"(a) attention: Active processing of specific incoming information.\n\n(b) divided attention: Multi-tasking; splitting focus across tasks (degrades performance if capacity exceeded).\n\n(c) selective attention: Focusing on specific cues while filtering out ambient distractions.\n\n(d) attention getting stimulus: Salient environmental cue (bright light, loud alarm) capturing immediate focus.\n\n(e) sensory threshold: Minimum stimulus intensity required for sensory detection.\n\n(f) sensitivity: Ability to discriminate between signal and background noise.\n\n(g) adaptation: Receptors becoming less sensitive to constant, unchanging stimulation (e.g., engine noise).\n\n(h) habituation: Brain ignoring predictable, non-threatening repeated signals over time."},
   {r:"46.44.6",q:"Describe the following types of memory:",a:"(a) peripheral/sensory memory: Ultra-short storage of raw sensory data (1-2 seconds).\n\n(b) short term/working memory: Active processing store holding ~7 (+/- 2) items for 15-30 seconds.\n\n(c) long term memory: Infinite capacity, permanent storage of knowledge and life events.\n\n(d) motor/skills memory: Procedural memory of physical actions learned through practice.\n\n(e) semantic memory: Memory of facts, concepts, rules, and general knowledge.\n\n(f) episodic memory: Memory of personally experienced specific events and timelines."},
   {r:"46.44.8",q:"Explain the following methods of retaining and retrieving information from memory:",a:"(a) chunking: Grouping individual pieces of data into larger meaningful units (e.g., grouping radio frequencies).\n\n(b) mnemonics: Memory tricks or acronyms (e.g., IMSAFE, CRAFT).\n\n(c) associations: Linking new information to existing familiar visual images or verbal facts.\n\n(d) checklists: External cognitive tools preventing reliance on memory for critical steps.\n\n(e) aides memoire: Visual or physical prompts to trigger memory of required tasks."},
   {r:"46.44.10",q:"Explain the concept of mental workload.",a:"The proportion of a pilot's limited mental capacity required to perform a given set of tasks at a given time."},
   {r:"46.44.12",q:"Explain the concept of overload.",a:"A condition where total task demand exceeds the pilot's available cognitive processing capacity, causing task shedding and degraded performance."},
   {r:"46.44.14",q:"Describe methods of managing potential overload.",a:"Prioritize tasks (Aviate, Navigate, Communicate), delegate tasks to co-pilot/automation, slow down operational pace, use checklists early, shed low-priority tasks."},
   {r:"46.44.16",q:"Describe and compare skill, rule and knowledge based behaviours.",a:"Skill-based: Automatic, highly practiced physical routines requiring minimal conscious thought. Rule-based: Following established procedures/SOPs in response to recognized situations. Knowledge-based: Conscious problem-solving in novel, unfamiliar situations requiring heavy cognitive effort."},
   {r:"46.44.18",q:"Describe the process of acquiring a skill.",a:"1. Cognitive Stage: Understanding task rules and steps with conscious effort. 2. Associative Stage: Practice refining movements, dropping errors. 3. Autonomous Stage: Performance becomes automatic, fast, and effortless."},
   {r:"46.44.20",q:"Describe failures of skill, rule and knowledge based behaviours.",a:"Skill-based failures: Slips (action motor slip) or Lapses (memory failure). Rule-based failures: Applying incorrect rule or misapplying good rule to wrong situation. Knowledge-based failures: Incomplete/inaccurate mental model or flawed problem-solving logic."},
   {r:"46.44.22",q:"Explain confirmation bias.",a:"The subconscious tendency to search for, favor, and recall information that confirms existing beliefs while ignoring contradictory evidence."},
   {r:"46.44.24",q:"Describe the formation of mental models.",a:"Internal dynamic cognitive representations of the external aircraft environment constructed from training, experience, sensory inputs, and expectations."}
  ]},
{r:"46.46",t:"SITUATIONAL AWARENESS",s:"Subject 46 · Human Factors",cards:[
   {r:"46.46.2",q:"Describe strategies to maintain and enhance situational awareness.",a:"Thorough pre-flight planning, active monitoring of flight instruments, clear communication, anticipating upcoming flight phases, managing workload, minimizing distractions, and verifying assumptions."},
   {r:"46.46.4",q:"Explain the relationship between CRM and the building of situational awareness amongst flight-crew.",a:"CRM techniques (advocacy, cross-checking, open communication, shared mental models) ensure all crew members share the same operational picture, enhancing combined situational awareness."}
  ]},
{r:"46.48",t:"JUDGEMENT AND DECISION MAKING",s:"Subject 46 · Human Factors",cards:[
   {r:"46.48.2",q:"Explain clues or red flags that can assist in identifying the error/poor judgement chain.",a:"Unresolved discrepancies, departure from SOPs, ambiguity, channelized attention, feeling rushed, poor communication, failure to meet targets, non-standard aircraft configuration."},
   {r:"46.48.4",q:"Identify risk assessment techniques.",a:"Assessing Likelihood vs Severity of hazards using Risk Matrices, applying checklists (PEAR, PAVE: Pilot, Aircraft, enVironment, External pressures)."},
   {r:"46.48.6",q:"Identify risk levels that compromise safety.",a:"Any unmitigated risk where potential severity and probability exceed company risk tolerance thresholds or regulatory safety limits."},
   {r:"46.48.8",q:"Describe the elements and risk levels associated with ultra-safe systems.",a:"Ultra-safe systems experience fewer than 1 catastrophic failure per 1 million operations (10^-6), achieved through redundant systems, strict standardization, robust CRM, and Safety Management Systems (SMS)."},
   {r:"46.48.10",q:"Identify risks that would degrade system safety goals.",a:"SOP non-compliance, complacency, high fatigue, inadequate training, poor safety culture, commercial pressure, unmaintained equipment."},
   {r:"46.48.12",q:"Describe the following risk management strategies:",a:"(a) isolation: Separating hazard from potential targets (e.g., airspace segregation).\n\n(b) mitigation: Reducing probability or severity of hazard (e.g., standard procedures, protective gear).\n\n(c) elimination: Completely removing hazard source (e.g., cancelling flight in severe weather)."},
   {r:"46.48.14",q:"Explain the application of decision-making models used in aviation:",a:"(a) DECIDE: Detect, Estimate, Choose, Identify, Do, Evaluate.\n\n(b) SADIE: Situation, Analyse, Decision, Implement, Evaluate.\n\n(c) FORDEC/FDODAR: Facts, Diagnostics, Options, Decision, Assign tasks, Review."},
   {r:"46.48.16",q:"Identify situations where time pressure compromises safety or increases risk levels.",a:"Tight turnarounds, weather deterioration, low fuel state, running behind schedule, ATC delays; leads to skipped checks, rushed decisions, and error chains."}
  ]},
{r:"46.50",t:"SOCIAL PSYCHOLOGY AND FLIGHT DECK MANAGEMENT",s:"Subject 46 · Human Factors",cards:[
   {r:"46.50.2",q:"Identify the broad characteristics of personality and distinguish individual differences.",a:"Personality comprises enduring patterns of thought, emotion, and behavior. Individual differences include extraversion, neuroticism, conscientiousness, agreeableness, and openness."},
   {r:"46.50.4",q:"Describe methods of maximising crew resource management.",a:"Encouraging open communication, active listening, briefed expectations, flat non-inhibiting authority gradient, clear task allocation, constructive feedback."},
   {r:"46.50.6",q:"Identify the factors that affect team performance.",a:"Leadership style, communication clarity, trust, mutual support, clear role definitions, fatigue, workload, stress, and cultural alignment."},
   {r:"46.50.8",q:"Describe how effective teams or team working can reduce errors.",a:"Provides redundant error detection (cross-checking), broader problem-solving perspectives, shared workload, and mutual support under pressure."},
   {r:"46.50.10",q:"Explain the advantages and disadvantages of group decision making.",a:"Advantages: Pool of experience, better hazard detection, shared commitment. Disadvantages: Takes longer, risk shift phenomenon, groupthink, social pressure to conform."},
   {r:"46.50.12",q:"Explain the concepts of:",a:"(a) risk shift: Groups making decisions that are significantly riskier (or more conservative) than decisions individuals would make alone.\n\n(b) conformity: Changing behavior/opinions to match group expectations or consensus.\n\n(c) compliance: Agreeing with or yielding to a direct command/request despite holding personal doubts."},
   {r:"46.50.14",q:"Describe personality traits and explain their effect on group decision making:",a:"(a) introversion: Reserved, quiet; may hold back valuable input unless explicitly invited.\n\n(b) extraversion: Outgoing, talkative; may dominate discussions and overshadow quieter crew members.\n\n(c) anxiety: Highly sensitive to stress; may rush decisions or freeze under high pressure."},
   {r:"46.50.16",q:"Explain and differentiate between goal/task directed and relationship directed styles of behaviour.",a:"Task-directed: Focuses strictly on getting work done, achieving objectives, schedule adherence. Relationship-directed: Focuses on crew harmony, interpersonal climate, and mutual comfort. Balanced leadership combines both."},
   {r:"46.50.18",q:"Describe autocratic and democratic leadership styles.",a:"Autocratic: Leader commands without consulting crew; fast, but suppresses crew input and error-trapping. Democratic: Leader consults crew and encourages input before deciding; fosters CRM, but takes longer."},
   {r:"46.50.20",q:"Describe ideal leadership characteristics.",a:"Decisive yet open-minded, approachable, maintains effective authority gradient, practice active listening, communicates clearly, manages workload effectively."},
   {r:"46.50.22",q:"Explain problems that can arise from:",a:"(a) status/seniority differences: Junior crew reluctant to challenge senior captain's mistakes.\n\n(b) lack of assertiveness: Failing to voice safety concerns clearly and promptly.\n\n(c) cultural differences: Power-distance gaps causing communication barriers or reluctance to speak up."},
   {r:"46.50.24",q:"Explain the concept of authority gradient.",a:"The balance of decision-making authority, power, and hierarchy established between the Pilot in Command and co-pilot."},
   {r:"46.50.26",q:"Explain the advantages and disadvantages of varying cockpit authority gradients.",a:"Balanced gradient: Optimal; permits efficient command while encouraging open crew communication and challenge. Steep gradient: Captain dominant; co-pilot silent, leading to undetected errors. Shallow/Flat gradient: Unclear command boundary; slow decisions, potential confusion."},
   {r:"46.50.28",q:"Explain problems that can arise from an authority gradient that is too steep or too shallow.",a:"Too steep: Co-pilot fails to intervene during unsafe situations. Too shallow: Confusion over who is in ultimate command, leads to debate during time-critical emergencies."},
   {r:"46.50.30",q:"Describe the cultural aspects of authority gradients.",a:"National cultures with high Power Distance Index (PDI) naturally create steep authority gradients, making assertiveness by junior crew culturally difficult without explicit CRM training."},
   {r:"46.50.32",q:"Explain the influence of the following on cockpit communication effectiveness:",a:"(a) enquiry, advocacy and assertion: Crucial for raising safety concerns progressively (Pace model: Probe, Alert, Challenge, Emergency action).\n\n(b) listening: Active listening ensures messages are received and understood accurately.\n\n(c) conflict resolution: Resolving disputes objectively by focusing on \"what is right, not who is right\".\n\n(d) critique/feedback: Debriefing flight phases constructively builds performance and trust."},
   {r:"46.50.34",q:"Describe the barriers to effective communication.",a:"Noise, fatigue, stress, high workload, jargon, hidden assumptions, steep authority gradient, personal biases, language barriers."},
   {r:"46.50.36",q:"Identify techniques to reduce communication barriers.",a:"Using standard phraseology, concise language, active listening, encouraging feedback, maintaining a professional cockpit environment."},
   {r:"46.50.38",q:"Explain strategies used to reduce communication errors in aviation:",a:"(a) read-backs: Verbally repeating critical ATC clearances to confirm accurate receipt.\n\n(b) standard phraseology: Using standardized regulatory phrasing to prevent ambiguity.\n\n(c) standard calls: Mandated verbal callouts for instrument indications and flight stages.\n\n(d) cross-checks: Verifying co-pilot actions/settings before execution.\n\n(e) document verification checks: Mutual cross-referencing of flight plans, performance data, charts.\n\n(f) display and control setting checks: Verifying cockpit setups systematically.\n\n(g) sterile cockpit policies: Prohibiting non-essential conversation below 10,000 feet."},
   {r:"46.50.40",q:"Identify signs that information transfer has been successful or otherwise.",a:"Successful: Accurate read-back, correct physical execution, verbal confirmation. Unsuccessful: Silence, head nodding without read-back, incorrect setting execution, confused expression."},
   {r:"46.50.42",q:"Describe differences between upward, downward and horizontal communication and give examples.",a:"Upward: Junior to senior (e.g., First Officer voicing weather concern to Captain). Downward: Senior to junior (e.g., Captain issuing briefing instructions to cabin crew). Horizontal: Peer to peer (e.g., Captain discussing routing with another Captain/ATC)."},
   {r:"46.50.44",q:"Describe means of managing effective communications between flight crew and:",a:"(a) cabin crew: Structured briefings (NITS: Nature, Intention, Time, Special instructions), clear interphone protocols.\n\n(b) passengers: Clear, calm, professional announcements; concise emergency guidance.\n\n(c) air traffic control services: Precise standard phraseology, immediate clarification if in doubt.\n\n(d) maintenance personnel: Accurate logbook entries, structured verbal handovers.\n\n(e) company personnel: Concise operational messages via ACARS/VHF, clear status updates."}
  ]},
{r:"46.52",t:"THREAT AND ERROR MANAGEMENT (TEM)",s:"Subject 46 · Human Factors",cards:[
   {r:"46.52.2",q:"Describe threats which could potentially affect a safe flight.",a:"Events or errors that occur outside the influence of the flight crew, increase operational complexity, and must be managed to maintain safety margins (e.g., severe weather, system malfunctions, ATC re-routes)."},
   {r:"46.52.4",q:"Describe threat management, including the means of:",a:"(a) recognising threats: Identifying potential hazards early via weather briefings, TEM briefs, radar monitoring.\n\n(b) avoiding: Planning routes/altitudes to stay away from hazards.\n\n(c) mitigating the effects: Preparing contingency plans, increasing altitude, carrying extra fuel."},
   {r:"46.52.6",q:"Describe and identify examples of overt/active threats.",a:"Threats immediately obvious and happening in real-time: Sudden convective thunderstorm, bird strike, system failure message."},
   {r:"46.52.8",q:"Describe and identify examples of latent threats.",a:"Hidden organizational or systemic threats dormant until triggered: Poorly worded manual procedure, inadequate training syllabus, bad cockpit control layout."},
   {r:"46.52.10",q:"Identify methods and means for detecting error in the aviation system.",a:"Cross-checking, flight data monitoring (FDM), checklist usage, safety audits, peer observation, alerting systems (TCAS/EGPWS)."},
   {r:"46.52.12",q:"Describe error avoidance techniques.",a:"Strict adherence to SOPs, briefings, double-checks, maintaining sterile cockpit, workload management."},
   {r:"46.52.14",q:"Explain how incipient errors can be trapped after they have been committed.",a:"Trapping errors occurs when an error is made but detected before it alters the safe state of the aircraft (e.g., co-pilot noticing incorrect altitude selection during cross-check and correcting it)."},
   {r:"46.52.16",q:"Explain how the consequences of errors that are not trapped can be mitigated.",a:"Mitigation occurs when an untrapped error leads to an Undesired Aircraft State (UAS), requiring immediate flying action to restore safety margins (e.g., executing a go-around after an unstable approach)."},
   {r:"46.52.18",q:"Explain how CRM countermeasures assist the management of threat and error.",a:"CRM provides systemic defenses (teamwork, communication, briefing, situational awareness) across three TEM lines of defense: Threat Avoidance, Error Trapping, UAS Mitigation."},
   {r:"46.52.20",q:"Describe and identify examples of a latent failure/error.",a:"Flawed decisions made at management, design, or organizational levels whose consequences remain dormant until combined with active operational triggers (e.g., maintenance procedure error written years prior)."},
   {r:"46.52.22",q:"Describe and identify examples of an active failure/error.",a:"Unsafe acts committed by front-line personnel (pilots, air traffic controllers) that have immediate effects (e.g., selecting wrong flap setting for takeoff)."}
  ]},
{r:"46.54",t:"CULTURE AND ORGANISATIONAL SAFETY",s:"Subject 46 · Human Factors",cards:[
   {r:"46.54.2",q:"Explain the principles of SMS in air operations.",a:"Safety Management System (SMS) is a systematic approach to managing safety, including organizational structures, accountabilities, policies, hazard identification, risk assessment, and safety assurance."},
   {r:"46.54.4",q:"Describe reporting mechanisms to rectify safety problems.",a:"Confidential safety reporting systems, voluntary hazard reports, mandatory CAA occurrence reports (CA005 form in NZ), air safety reports (ASR)."},
   {r:"46.54.6",q:"Define the core concept of an organisational culture.",a:"The shared values, beliefs, attitudes, and behaviors that determine how work is performed within an organization (\"how we do things around here\")."},
   {r:"46.54.8",q:"Outline the ways in which organisational culture affects performance.",a:"Determines safety compliance, open reporting willingness, adherence to SOPs, commercial pressure tolerance, and overall operational safety margins."},
   {r:"46.54.10",q:"Describe what is meant by harassment, its effects on employees and how it should be dealt with should it arise in the workplace.",a:"Unwelcome, offensive behavior targeting individuals. Effects: Stress, distraction, low morale, safety degradation. Management: Clear company anti-harassment policy, formal grievance channels, confidential reporting, swift investigation."},
   {r:"46.54.12",q:"Describe what is meant by stereotypes and stereotypical behaviour within organisations and give examples of where such behaviour may have a negative impact on safety.",a:"Generalized, oversimplified beliefs about specific groups (gender, age, nationality). Impact: Undermining trust, dismissive attitudes toward crew observations, compromised CRM."},
   {r:"46.54.14",q:"Describe the inertia of large organisations with respect to safety messages.",a:"Large organizations often change slowly due to bureaucracy, rigid hierarchy, ingrained habits, and resistance to altering legacy procedures despite safety alerts."},
   {r:"46.54.16",q:"List the key reasons for a safety reporting system within an aviation organisation.",a:"To identify hazards proactively, gather trend data, fix systemic faults, prevent repeat accidents, and build a non-punitive learning environment."},
   {r:"46.54.18",q:"Explain the relevance of internal hazard reporting.",a:"Enables front-line personnel to highlight minor defects or latent risks before they combine with other events to produce an accident."},
   {r:"46.54.20",q:"Describe the key elements of the Just Culture approach to the management of errors, reporting, and the use of disciplinary sanctions under this approach.",a:"An atmosphere of trust where people are encouraged to report safety information without fear of punishment for honest errors/slips. Distinguishes acceptable unintentional errors from unacceptable reckless behavior or intentional violations, which remain subject to discipline."},
   {r:"46.54.22",q:"Describe the concepts of risk creep and risk tolerance and their application within an aviation organisation.",a:"Risk Creep (Normalization of Deviance): Gradual acceptance of non-standard practices over time as no immediate accident occurs. Risk Tolerance: Increasing personal or organizational willingness to operate under elevated risk levels."}
  ]},
{r:"46.56",t:"FLIGHT DECK DESIGN AND ERGONOMICS",s:"Subject 46 · Human Factors",cards:[
   {r:"46.56.2",q:"Describe the basic principles of control, display and workspace design.",a:"Controls and displays must be logical, easily accessible, intuitive, standardized, unambiguous, clear under all lighting, and designed around human physical and cognitive limits."},
   {r:"46.56.4",q:"Explain the importance of the following in flight deck design:",a:"(a) reach: All critical controls must be reachable without unbuckling harness.\n\n(b) comfort: Prevents early physical fatigue and distraction during long flights.\n\n(c) posture: Proper spinal alignment reduces muscle fatigue and long-term injury.\n\n(d) lighting levels: Adjustable lighting ensures visibility while preserving night vision adaptation."},
   {r:"46.56.6",q:"Distinguish between biometrics, biomechanics and anthropometry.",a:"Biometrics: Statistical measurement of unique biological characteristics (fingerprints, iris). Biomechanics: Study of mechanical movement and forces exerted by the human body structure. Anthropometry: Measurement of human physical body dimensions, proportions, and reach limits."},
   {r:"46.56.8",q:"Describe applications of biomechanics in the design of flight decks.",a:"Designing control displacement forces, rudder pedal resistance, stick forces, and switch activation pressure to match human muscle capability without overexertion."},
   {r:"46.56.10",q:"Explain the relevance of anthropometry in the design of flight decks.",a:"Ensures cockpit dimensions accommodate 5th to 95th percentile physical body sizes for seating, reach, rudder deflection, and eye-position alignment."},
   {r:"46.56.12",q:"Describe the effects of a poorly designed cockpit on pilot performance.",a:"Increased physical fatigue, higher error rates, delayed emergency responses, confusion, muscle strain, and degraded situational awareness."},
   {r:"46.56.14",q:"Explain the importance of eye datum or eye design position.",a:"The specific eye position recommended by manufacturers ensuring optimal external field of view over nose and proper visual alignment with primary flight instruments/HUD."},
   {r:"46.56.16",q:"Describe the problems associated with windshield design and visibility.",a:"Reflections, refraction distortion, rain blur, bird-strike strength requirements limiting post size, frame blind spots, solar radiation glare."},
   {r:"46.56.18",q:"List the advantages and disadvantages of working in an automated cockpit.",a:"Advantages: Reduced physical workload, precise navigation, fuel efficiency, improved flight parameter monitoring. Disadvantages: Mode confusion, skill degradation, loss of situational awareness, complacency, monitoring fatigue."},
   {r:"46.56.20",q:"Describe the effects of advanced cockpit automation, including:",a:"(a) failure to monitor: Crew becoming passive observers rather than active monitors.\n\n(b) boredom and complacency: Reduced vigilance due to high system reliability.\n\n(c) loss of proficiency: Manual flying skill decay over time.\n\n(d) job satisfaction: Potential reduction due to feeling like a computer operator.\n\n(e) crew coordination: Shifting communication focus to programming FMS rather than crew interaction.\n\n(f) problems associated with equipment failure: Sudden spike in workload when automation fails unexpectedly."},
   {r:"46.56.22",q:"Explain the concept of mode awareness in setting up and operating automated systems.",a:"The pilot's continuous knowledge of which operational mode the Flight Management System and Autopilot are currently operating in (e.g., VNAV PATH vs VNAV SPD)."},
   {r:"46.56.24",q:"Describe elements of coping behaviour associated with automatic cockpits.",a:"Verifying FMS entries mutually, calling out FMA changes aloud, reverting to lower automation levels when confused, practicing manual flying when safe."}
  ]},
{r:"46.58",t:"DESIGN OF CONTROLS",s:"Subject 46 · Human Factors",cards:[
   {r:"46.58.2",q:"Explain the importance of the following in control design:",a:"(a) size: Appropriate for grip, operable while wearing gloves.\n\n(b) shape/recognition by touch: Tactile coding (e.g., wheel shape for gear lever, flap shape for flap lever) prevents misidentification.\n\n(c) location: Logical, standardized grouping based on function and priority.\n\n(d) layout and uniformity: Consistent spatial layout across fleet to prevent negative transfer.\n\n(e) direction of movement: Conventional direction (forward/up for increase, back/down for decrease) matching human natural expectations.\n\n(f) visibility: Clear labelling and color coding under all cockpit light conditions."}
  ]},
{r:"46.60",t:"INSTRUMENTATION, DISPLAYS AND ALERTS",s:"Subject 46 · Human Factors",cards:[
   {r:"46.60.2",q:"Explain the importance of the following in the design of instrumentation, displays and alerts:",a:"(a) size: Large enough for quick scanning and reading without straining vision.\n\n(b) position: Primary flight displays placed directly in primary visual field.\n\n(c) layout: Standard basic T / scan pattern organization.\n\n(d) visibility: Unobscured view from eye design position under all ambient light conditions.\n\n(e) legibility: High contrast, clean font types, no clutter.\n\n(f) scale: Intuitive scale increments matching required precision.\n\n(g) use of colour: Standardized coding (Red = Warning/Emergency, Amber = Caution, Green/White = Normal/Advisory).\n\n(h) illumination: Adjustable backlighting preventing night glare or daylight washout."},
   {r:"46.60.4",q:"Describe problems associated with the presentation and misinterpretation of alerts.",a:"False alerts causing cry-wolf syndrome/complacency, nuisance alarms during critical phases causing distraction, simultaneous multiple alerts causing cognitive overload."}
  ]},
{r:"46.62",t:"DOCUMENTS AND PROCEDURES",s:"Subject 46 · Human Factors",cards:[
   {r:"46.62.2",q:"Explain the importance of colour, font type and size for written checklists.",a:"High-contrast colors (black text on white/yellow background), clean sans-serif fonts (Helvetica/Arial), minimum font size (10-12pt) to ensure legibility under low lighting or turbulence."},
   {r:"46.62.4",q:"Describe problems associated with the design and use of checklists and manuals.",a:"Ambiguous phrasing, overly dense layout, skipping items due to interruptions, performing actions from memory without verification, using non-standard checklists."},
   {r:"46.62.6",q:"Describe problems associated with the design and use of maps and charts.",a:"Visual clutter, tiny text font, poor lighting legibility, incorrect fold layouts, outdated revisions, misinterpreting terrain shading or color scales."}
  ]}

var stage=document.getElementById('stage');
var card=document.getElementById('card');
var cardInner=document.getElementById('cardInner');
var topicList=document.getElementById('topicList');
var landing=document.getElementById('landing');
var cardsScreen=document.getElementById('cards');
var topicTitleEl=document.getElementById('topicTitle');
var counterEl=document.getElementById('counter');
var progressBar=document.getElementById('progressBar');

/* ---- theme ---- */
var theme=localStorage.getItem('atpl-theme')||'dark';
function applyTheme(){
  document.body.className=theme;
  var glyph=theme==='dark'?'\u2600\uFE0F':'\uD83C\uDF19';
  var btns=document.querySelectorAll('[aria-label="Toggle theme"]');
  for(var i=0;i<btns.length;i++){btns[i].textContent=glyph;}
}
function toggleTheme(){theme=(theme==='dark')?'light':'dark';localStorage.setItem('atpl-theme',theme);applyTheme();}
document.getElementById('themeBtn').onclick=toggleTheme;
document.getElementById('themeBtn2').onclick=toggleTheme;

/* ---- landing list ---- */
function buildLanding(){
  topicList.innerHTML='';
  var lastS=null;
  for(var i=0;i<DATA.length;i++){
    (function(i){
      var topic=DATA[i];
      if(topic.s!==lastS){var h=document.createElement('div');h.className='sect';h.textContent=topic.s;topicList.appendChild(h);lastS=topic.s;}
      var row=document.createElement('div');row.className='row';
      row.innerHTML='<div class="badge">'+topic.r+'</div><div class="info"><div class="t">'+topic.t+'</div><div class="c">'+topic.cards.length+' cards</div></div><div class="chev">&#8250;</div>';
      row.onclick=function(){openTopic(i);};
      topicList.appendChild(row);
    })(i);
  }
}

/* ---- card rendering ---- */
var currentTopic=0,cardIdx=0,busy=false;
var backHintEl=document.getElementById('backHint');
var bottomHintEl=document.getElementById('bottomHint');
function renderCard(){
  var cur=DATA[currentTopic];var c=cur.cards[cardIdx];
  document.getElementById('frontRef').textContent=c.r;
  document.getElementById('backRef').textContent=c.r;
  document.getElementById('frontQ').textContent=c.q;
  document.getElementById('backA').textContent=c.a;
  topicTitleEl.textContent=cur.t;
  var last=(cardIdx===cur.cards.length-1);
  counterEl.textContent=(cardIdx+1)+' / '+cur.cards.length;
  progressBar.style.width=((cardIdx+1)/cur.cards.length*100)+'%';
  backHintEl.innerHTML=last?'swipe up to finish &#8594;':'swipe up for next &middot; down for previous';
  bottomHintEl.innerHTML=last?'&#8593; finish topic&nbsp;&middot;&nbsp;&#8595; back':'&#8593; next &nbsp;&middot;&nbsp; &#8595; back';
  cardInner.classList.remove('flipped');
}
var toastEl=document.getElementById('toast'),toastTimer=null;
function showToast(msg){
  toastEl.textContent=msg;toastEl.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.classList.remove('show');},1800);
}
function openTopic(i){
  currentTopic=i;cardIdx=0;
  landing.classList.add('hidden');cardsScreen.classList.remove('hidden');
  renderCard();
  busy=true;
  card.style.transition='none';card.style.transform='translateY(28px)';card.style.opacity='0';
  requestAnimationFrame(function(){
    card.style.transition='transform .3s ease, opacity .3s ease';
    card.style.transform='translateY(0)';card.style.opacity='1';
    setTimeout(function(){busy=false;},320);
  });
}
function goHome(){
  cardsScreen.classList.add('hidden');landing.classList.remove('hidden');
  cardInner.classList.remove('flipped');
  card.style.transition='none';card.style.transform='translateY(0)';card.style.opacity='1';
}
document.getElementById('backBtn').onclick=goHome;

function flip(){cardInner.classList.toggle('flipped');}

/* ---- navigation with animation ---- */
function navigate(dir){
  if(busy)return;busy=true;
  var exitY=(dir==='up')?'-120%':'120%';
  var rot=(dir==='up')?-16:16;
  card.style.transition='transform .28s ease, opacity .28s ease';
  card.style.transform='translateY('+exitY+') rotateX('+rot+'deg)';
  card.style.opacity='0';
  setTimeout(function(){
    if(dir==='up'){
      if(cardIdx<DATA[currentTopic].cards.length-1){cardIdx++;}
      else{busy=false;goHome();showToast('\u2713 Topic complete');return;}
    }
    else{if(cardIdx>0)cardIdx--;}
    renderCard();
    var enterY=(dir==='up')?'120%':'-120%';
    card.style.transition='none';
    card.style.transform='translateY('+enterY+') rotateX('+(-rot)+'deg)';
    card.style.opacity='0';
    requestAnimationFrame(function(){
      card.style.transition='transform .28s ease, opacity .28s ease';
      card.style.transform='translateY(0) rotateX(0)';
      card.style.opacity='1';
      setTimeout(function(){busy=false;},60);
    });
  },270);
}

/* ---- swipe / tap (pointer events) ---- */
var sx=0,sy=0,st=0,dragging=false;
stage.addEventListener('pointerdown',function(e){
  if(busy)return;
  sx=e.clientX;sy=e.clientY;st=Date.now();dragging=false;
  if(stage.setPointerCapture){try{stage.setPointerCapture(e.pointerId);}catch(err){}}
});
stage.addEventListener('pointermove',function(e){
  if(busy||dragging)return;
  var dy=e.clientY-sy,dx=e.clientX-sx;
  /* only treat as a swipe once the finger clearly commits: >20px and mostly vertical */
  if(Math.abs(dy)>20 && Math.abs(dy)>Math.abs(dx)){dragging=true;}
  if(dragging){
    card.style.transition='none';
    card.style.transform='translateY('+dy+'px) rotateX('+(dy*0.04)+'deg)';
  }
});
function endSwipe(e){
  if(busy)return;
  var dx=e.clientX-sx,dy=e.clientY-sy,dt=Date.now()-st;
  var dist=Math.sqrt(dx*dx+dy*dy);
  /* swipe wins: clear vertical travel of 70px+ (up = next, down = previous) */
  if(Math.abs(dy)>=70 && Math.abs(dy)>Math.abs(dx)){navigate(dy<0?'up':'down');return;}
  /* tap = small total finger travel (real taps jitter up to ~48px); release within a second flips the card */
  if(dist<=48 && dt<1000){flip();return;}
  /* anything else: snap back */
  card.style.transition='transform .3s ease';
  card.style.transform='translateY(0) rotateX(0)';
  setTimeout(function(){card.style.transition='';},300);
}
stage.addEventListener('pointerup',endSwipe);
stage.addEventListener('pointercancel',function(e){if(busy)return;card.style.transition='transform .3s ease';card.style.transform='translateY(0) rotateX(0)';});

/* ---- keyboard (desktop convenience) ---- */
window.addEventListener('keydown',function(e){
  if(cardsScreen.classList.contains('hidden'))return;
  if(e.key==='Escape'){goHome();}
  else if(e.key==='ArrowUp'||e.key==='ArrowRight'||e.key===' '){e.preventDefault();navigate('up');}
  else if(e.key==='ArrowDown'||e.key==='ArrowLeft'){e.preventDefault();navigate('down');}
});

/* ---- init ---- */
applyTheme();
buildLanding();
</script>
