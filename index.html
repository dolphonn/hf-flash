{r:"46.44",t:"Cognition",s:"Aviation Psychology",cards:[
 {r:"46.44.2",q:"Explain what is meant by cognition.",a:"Cognition is the mental processes involved in acquiring knowledge and understanding: perception, attention, memory, thinking, judgement and decision-making. In flight it underpins how a pilot interprets instruments, weather and traffic and chooses actions."},
 {r:"46.44.4",q:"Explain what is meant by perception.",a:"Perception is the brain's interpretation of sensory information (sight, sound, feel) to make sense of the environment. It is not a passive recording — it is shaped by expectation, experience and context, which is why illusions and misreads occur in flight."},
 {r:"46.44.6",q:"Explain what is meant by attention.",a:"Attention is the selective focus of awareness on particular information while ignoring other input. It has limited capacity — divided or overloaded attention (many tasks, distractions) causes items to be missed, a key source of in-flight errors."},
 {r:"46.44.8",q:"Explain what is meant by memory.",a:"Memory is the ability to encode, store and retrieve information over time. Pilots rely on working memory (immediate task info) and long-term memory (procedures, checklists); overload, stress or inattention cause lapses that lead to errors."},
 {r:"46.44.10",q:"Explain what is meant by thinking.",a:"Thinking is the higher mental process of reasoning, problem-solving and forming judgements — using concepts, rules and experience to interpret situations. Structured thinking (checklists, decision models) improves safety over unstructured 'gut' reactions."},
 {r:"46.44.12",q:"Explain what is meant by judgement.",a:"Judgement is the ability to evaluate a situation and determine the correct or best course of action — weighing risks, options and consequences. Good aviation judgement combines knowledge, experience and humility (knowing your limits)."},
 {r:"46.44.14",q:"Explain what is meant by reasoning.",a:"Reasoning is drawing conclusions from available information — deductive (from general rule to specific case) or inductive (from observations to a likely conclusion). It supports diagnosis of faults and predicting how a situation will develop."},
 {r:"46.44.16",q:"Explain what is meant by problem solving.",a:"Problem solving is identifying a problem, analysing its causes, generating options and selecting/evaluating the best solution. In aviation it must be structured (e.g. DECIDE) so faults are diagnosed correctly rather than guessed at."},
 {r:"46.44.18",q:"Explain what is meant by decision making.",a:"Decision making is choosing a course of action from available options based on the situation. Effective aviation decision making uses a structured model (DECIDE, DODAR/FDODAR, SADIE), relies on facts, and includes a 'stop' option when conditions are unsafe."},
 {r:"46.44.20",q:"Explain what is meant by cognitive bias.",a:"Cognitive bias is a systematic error in thinking that distorts judgement — e.g. overconfidence, confirmation or get-there pressure. Biases are normal but dangerous in flight; awareness of common ones (and using checklists/crew) helps counter them."},
 {r:"46.44.22",q:"Explain what is meant by confirmation bias.",a:"Confirmation bias is the tendency to seek, notice and favour information that confirms an existing belief or plan, while ignoring contradictory evidence. In flight it makes a pilot fix on one explanation (or keep going on plan) and miss red flags."},
 {r:"46.44.24",q:"Explain the decision making models used in aviation.",a:"Common structured models: DECIDE (Define the problem, Establish goals, Collect information, Identify options, Decide/Execute, Evaluate); DODAR/FDODAR (Diagnose, Options, Decide, Assign, Review — with 'Find' the problem first); and SADIE (Scan, Assess, Decide, Implement, Evaluate). They force a disciplined, bias-resistant process."}
]},
{r:"46.46",t:"Memory",s:"Aviation Psychology",cards:[
 {r:"46.46.2",q:"Explain what is meant by memory.",a:"Memory is the system for encoding, storing and retrieving information. It underpins everything from reading a checklist to recalling procedures under stress; understanding its limits helps pilots use aids (checklists, briefings) to compensate."},
 {r:"46.46.4",q:"Explain what is meant by short-term memory.",a:"Short-term/working memory holds a small amount of information for seconds to a minute (about 7±2 items) while it is being used. It is easily overloaded and cleared by distraction — hence chunking and writing things down in the cockpit."},
 {r:"46.46.6",q:"Explain what is meant by long-term memory.",a:"Long-term memory stores information for minutes to a lifetime with effectively unlimited capacity — e.g. procedures, checklists, past experiences. It is accessed through retrieval; stress and lack of rehearsal can cause 'blanking' even when knowledge exists."},
 {r:"46.46.8",q:"Explain what is meant by working memory.",a:"Working memory is the active part of short-term memory used to manipulate information for a task — holding a frequency, an altitude and a heading while deciding. Its limited capacity means dividing attention between many items degrades performance."},
 {r:"46.46.10",q:"Explain what is meant by encoding.",a:"Encoding is the process of converting sensory input into a form the brain can store — deeper, meaningful processing (chunking, linking to experience) produces stronger memories than passive repetition. Good briefing and rehearsal improve encoding."},
 {r:"46.46.12",q:"Explain what is meant by storage.",a:"Storage is retaining encoded information in memory over time. Information moves from short-term toward long-term storage through attention, rehearsal and meaning; without this, details are quickly lost — so critical items should be written or repeated."},
 {r:"46.46.14",q:"Explain what is meant by retrieval.",a:"Retrieval is accessing stored information when needed — e.g. recalling a procedure or a contact frequency. It can fail under stress or without cues even when the information was learned; checklists and mnemonics act as retrieval aids."},
 {r:"46.46.16",q:"Explain what is meant by recall.",a:"Recall is retrieving information from memory without seeing it (e.g. remembering a clearance) — stronger than recognition but harder under load. Pilots use structured briefings and checklists to support accurate recall of critical data."},
 {r:"46.46.18",q:"Explain what is meant by recognition.",a:"Recognition is identifying information as familiar when presented again (e.g. recognising a fault on a checklist) — easier than recall because the cue is present. Well-designed checklists and displays exploit recognition to reduce memory load."},
 {r:"46.46.20",q:"Explain what is meant by forgetting.",a:"Forgetting is the loss of access to stored information over time or due to interference, stress or lack of rehearsal. It is why procedures are trained, repeated and supported by checklists rather than relying on unaided memory."}
]});
DATA.push(
{r:"46.48",t:"Attention",s:"Aviation Psychology",cards:[
 {r:"46.48.2",q:"Explain what is meant by attention.",a:"Attention is the limited mental focus on selected information while ignoring other input. Because capacity is small, dividing or overloading it (multiple tasks, distractions) causes items to be missed — a leading cause of in-flight errors."},
 {r:"46.48.4",q:"Explain what is meant by selective attention.",a:"Selective attention is focusing on some stimuli while filtering out others (e.g. listening to ATC while ignoring cabin noise). It is essential but means unattended channels are missed — so structured scanning and briefings are needed to cover all critical inputs."},
 {r:"46.48.6",q:"Explain what is meant by divided attention.",a:"Divided attention is trying to process several things at once (e.g. flying the aircraft, comms and nav simultaneously). Capacity is limited, so performance on each task drops; critical tasks should not be divided — use automation or sequencing."},
 {r:"46.48.8",q:"Explain what is meant by sustained attention.",a:"Sustained attention (vigilance) is maintaining focus over a long period (e.g. monitoring instruments on a quiet leg). It declines with time, boredom and low workload — vigilance decrement causes 'misses' late in a task."},
 {r:"46.48.10",q:"Explain what is meant by attentional tunneling.",a:"Attentional tunneling (tunnel vision of the mind) is narrowing focus onto one thing so much that other important information is missed — e.g. fixating on a problem and losing awareness of altitude or traffic. It is worsened by stress and workload."},
 {r:"46.48.12",q:"Explain what is meant by the 'red flags' of poor attention.",a:"Red flags are early warning signs that attention/awareness is degrading — fixating on one item, losing track of time or task, missing checklists, feeling rushed, or rationalising a deviation (plan-continuation/'get-there' bias). Recognising them prompts you to stop, breathe and re-scan."},
 {r:"46.48.14",q:"Explain what is meant by the 'startle effect'.",a:"The startle effect is an involuntary reaction to a sudden, unexpected stimulus (noise, movement) that briefly disrupts attention and performance. In flight it can cause an unwanted control input or a missed item — awareness helps you recover quickly."},
 {r:"46.48.16",q:"Explain what is meant by the 'cockpit clutter'.",a:"Cockpit clutter refers to unnecessary items, displays or distractions competing for limited attention and space. It increases workload and error risk; good design and tidiness (and decluttering) help keep attention on the essential flight-critical information."}
]});
DATA.push(
{r:"46.50",t:"Communication",s:"Aviation Psychology",cards:[
 {r:"46.50.2",q:"Explain what is meant by communication.",a:"Communication is the process of transmitting and receiving information between people — in aviation, clear exchange of flight-critical data (clearances, positions, intentions). Errors or ambiguities here are a major cause of incidents, so standard phrases and read-backs are used."},
 {r:"46.50.4",q:"Explain what is meant by verbal communication.",a:"Verbal communication is exchanging information through spoken words (e.g. radio with ATC, crew briefings). It relies on clear phrasing, standard aviation terminology, correct pronunciation and confirmation (read-back) to avoid misunderstanding."},
 {r:"46.50.6",q:"Explain what is meant by non-verbal communication.",a:"Non-verbal communication conveys information without words — tone of voice, facial expression, eye contact, posture and gestures. It carries much of the meaning in crew interactions; mismatches between words and non-verbal cues can hide disagreement or confusion."},
 {r:"46.50.8",q:"Explain what is meant by active listening.",a:"Active listening is fully concentrating on the speaker — checking understanding, asking for clarification, and confirming key points (e.g. read-back). It prevents miscommunication; passive or distracted listening misses critical information."},
 {r:"46.50.10",q:"Explain what is meant by a message.",a:"A message is the information sent from sender to receiver — e.g. an ATC instruction or a pilot's report. For it to be effective it must be clear, complete and unambiguous; noise, accent or poor phrasing can corrupt the message."},
 {r:"46.50.12",q:"Explain what is meant by a sender.",a:"The sender is the person originating the message (e.g. ATC issuing a clearance, or a pilot reporting). The sender's responsibility is to phrase it clearly and check it was understood — using standard terms and confirming via read-back."},
 {r:"46.50.14",q:"Explain what is meant by a receiver.",a:"The receiver is the person who gets and interprets the message (e.g. the pilot receiving a clearance). Their responsibility is to listen actively, decode it correctly, and confirm understanding — typically by reading back the critical parts."},
 {r:"46.50.16",q:"Explain what is meant by feedback.",a:"Feedback is the response that confirms whether the message was received and understood as intended — in aviation, the read-back of clearances and the sender's confirmation. It closes the communication loop and catches errors before they matter."},
 {r:"46.50.18",q:"Explain what is meant by noise (in communication).",a:"Noise here is anything that distorts or blocks the message — physical (static, engine roar), semantic (unclear phrasing, jargon) or psychological (stress, assumption). Reducing noise and confirming understanding keeps communications safe."},
 {r:"46.50.20",q:"Explain what is meant by a barrier to communication.",a:"A barrier to communication is anything that hinders clear exchange — language/accent differences, stress, poor radio, hierarchy (not speaking up), or assuming you know what the other means. Crew Resource Management and read-backs are used to overcome them."}
]});
DATA.push(
{r:"46.52",t:"Teamwork",s:"Aviation Psychology",cards:[
 {r:"46.52.2",q:"Explain what is meant by teamwork.",a:"Teamwork is people working together toward a shared goal, coordinating roles and information so the whole performs better than the sum of individuals. In aviation it means the crew sharing workload, cross-checking and communicating to fly safely."},
 {r:"46.52.4",q:"Explain what is meant by a team.",a:"A team is a group of people with complementary roles working toward a common objective — in flight, the flight crew (and ground/ATC interfaces). Effective teams have clear roles, mutual trust and open communication."},
 {r:"46.52.6",q:"Explain what is meant by Crew Resource Management.",a:"Crew Resource Management (CRM) is the systematic use of all available resources — people, equipment, procedures and information — to manage workload and risk safely. It includes leadership, communication, decision-making and error management within the crew."},
 {r:"46.52.8",q:"Explain what is meant by leadership.",a:"Leadership in a cockpit is guiding the team, allocating workload, making final decisions and creating an environment where others can speak up. Effective leaders are decisive but open to input — the 'stop' decision belongs to any crew member who sees danger."},
 {r:"46.52.10",q:"Explain what is meant by assertiveness.",a:"Assertiveness is confidently and respectfully stating your view, concern or disagreement — including challenging a superior when safety is at risk (e.g. a junior pilot questioning an unsafe instruction). It is essential for catching errors in the crew."},
 {r:"46.52.12",q:"Explain what is meant by conflict.",a:"Conflict is disagreement or tension between team members — over a decision, workload or approach. Unmanaged it degrades teamwork and safety; handled openly and professionally it can surface important concerns and improve decisions."},
 {r:"46.52.14",q:"Explain what is meant by cooperation.",a:"Cooperation is working together willingly toward the shared goal — sharing information, helping with workload, and supporting each other. It underpins effective teamwork and reduces the chance that one person's error or overload goes uncaught."},
 {r:"46.52.16",q:"Explain what is meant by coordination.",a:"Coordination is organising team actions so they fit together without gaps or clashes — e.g. who flies, who monitors, who calls out. Clear coordination (briefings, callouts, cross-checks) prevents duplicated or missed tasks."}
]});
DATA.push(
{r:"46.54",t:"Safety and organisational culture",s:"Aviation Psychology",cards:[
 {r:"46.54.2",q:"Explain what is meant by safety.",a:"Safety is the condition of risk being reduced to, and maintained at, an acceptable level — protecting people from harm in aviation operations. It is achieved proactively through design, procedures, training and a strong safety culture, not just by avoiding accidents."},
 {r:"46.54.4",q:"Explain what is meant by a hazard.",a:"A hazard is anything with the potential to cause harm — a condition, action or situation (e.g. slippery runway, ambiguous procedure, fatigue). Identifying hazards is the first step in safety management so they can be assessed and controlled."},
 {r:"46.54.6",q:"Explain what is meant by a risk.",a:"Risk is the combination of the likelihood of a hazard occurring and the severity of its consequences. Risk assessment (likelihood × severity) prioritises which hazards to control first — high-impact, likely risks get top attention."},
 {r:"46.54.8",q:"Explain what is meant by a safety culture.",a:"A safety culture is the shared attitudes, beliefs and behaviours about safety in an organisation. A strong (just) safety culture encourages honest reporting of errors and hazards for learning, rather than blame — so problems are fixed before they cause harm."},
 {r:"46.54.10",q:"Explain what is meant by a just culture.",a:"A just culture distinguishes honest human error from reckless or deliberate violations: errors are met with support and learning (no unjust punishment), while gross negligence is addressed. This encourages people to report mistakes, which is essential for safety."},
 {r:"46.54.12",q:"Explain what is meant by a reporting culture.",a:"A reporting culture is one where people feel safe and encouraged to report errors, hazards and near-misses without fear of blame. These reports feed the SMS, revealing systemic weaknesses before they cause accidents."},
 {r:"46.54.14",q:"Explain what is meant by a learning culture.",a:"A learning culture treats every error, incident and report as an opportunity to understand causes and improve — rather than simply blaming individuals. It drives continuous improvement through investigation, feedback and better design/training."},
 {r:"46.54.16",q:"Explain what is meant by a blame culture.",a:"A blame culture punishes individuals for errors instead of learning from them, so people hide mistakes and hazards go unreported. It undermines safety because the organisation loses the information it needs to fix underlying problems."},
 {r:"46.54.18",q:"Explain what is meant by an organisational culture.",a:"Organisational culture is the unwritten 'way things are done' — the shared values and norms that actually drive behaviour, often more than formal policies. A positive safety-focused culture means everyone genuinely prioritises safety over schedule or cost."},
 {r:"46.54.20",q:"Explain what is meant by a safety management system.",a:"A Safety Management System (SMS) is the structured, proactive process for identifying hazards, assessing risk and implementing/monitoring controls — including reporting, investigation and continuous review. It shifts focus from reacting to accidents to preventing them."}
]});
DATA.push(
{r:"46.56",t:"Flight deck design",s:"Ergonomics",cards:[
 {r:"46.56.2",q:"Explain the basic principles of control, display and workspace design.",a:"Controls should be arranged logically, consistently and with clear feedback (position/shape/movement matching their function — 'self-describing'). Displays should present relevant information clearly, in a natural scan order, without clutter or ambiguity. The workspace must fit the pilot's size and reach so everything is accessible without strain."},
 {r:"46.56.4",q:"Explain the importance of reach and comfort in flight deck design.",a:"Reach: controls and displays must be within the pilot's comfortable, safe reach (and sight lines) so they can be operated accurately without overreaching or losing sight of instruments — critical under stress. Comfort: a correctly sized, adjustable seat and workspace reduce fatigue and allow the pilot to maintain good posture and visibility for the whole flight."},
 {r:"46.56.6",q:"Explain what is meant by anthropometry.",a:"Anthropometry is the measurement of the human body's dimensions (height, reach, limb lengths) and their population distribution. Designers use it to size cockpits, seats and controls so they suit a wide range of pilots — e.g. designing for the 5th to 95th percentile."},
 {r:"46.56.8",q:"Explain what is meant by ergonomics.",a:"Ergonomics (human factors engineering) is designing systems, tools and workplaces to fit human capabilities and limits — improving safety, comfort and efficiency. In aviation it shapes the cockpit layout, controls and displays to match how pilots actually operate."},
 {r:"46.56.10",q:"Explain what is meant by a workstation.",a:"A workstation is the area where a person performs tasks — for a pilot, the flight deck with its seat, controls, displays and switches. Good workstation design places everything within reach and view, minimises strain and supports efficient, error-resistant operation."},
 {r:"46.56.12",q:"Explain what is meant by a control.",a:"A control is a device the pilot uses to command the aircraft or systems — levers, yokes, throttles, switches, knobs. Good controls are unambiguous (position/shape/movement indicates function), give feedback and are arranged to prevent wrong inputs."},
 {r:"46.56.14",q:"Explain what is meant by a display.",a:"A display presents information to the pilot — instruments, screens, lights, gauges. Good displays show the right information clearly and in a logical scan order, use consistent symbols, avoid clutter, and are readable at all light levels."},
 {r:"46.56.16",q:"Explain what is meant by an interface.",a:"An interface is the point where the pilot and the system interact — the combined set of controls (input) and displays (output). A well-designed interface makes actions intuitive, gives immediate feedback and minimises the chance of wrong inputs or misreadings."}
]},
{r:"46.58",t:"Workstation design",s:"Ergonomics",cards:[
 {r:"46.58.2",q:"Explain what is meant by a workstation.",a:"A workstation is the designed area where work is performed — for a pilot, the seat, controls, displays and surrounding space of the flight deck. It should fit the user's body and task so work is efficient, comfortable and safe."},
 {r:"46.58.4",q:"Explain what is meant by a seat.",a:"A seat is the support that positions the pilot in the workstation. A good cockpit seat is adjustable (height, depth, back) to suit different body sizes, supports correct posture and visibility, and reduces fatigue over long duties."},
 {r:"46.58.6",q:"Explain what is meant by a control panel.",a:"A control panel is the arrangement of controls and displays within reach of the pilot. Good layout groups related functions logically, keeps critical items prominent, and uses consistent, self-describing controls to reduce errors."},
 {r:"46.58.8",q:"Explain what is meant by a display panel.",a:"A display panel is the set of instruments/screens that present flight and system information. It should be arranged in a natural scan order (primary flight info prominent), be uncluttered, consistent and readable — so the pilot can read it accurately under stress."},
 {r:"46.58.10",q:"Explain what is meant by an instrument panel.",a:"An instrument panel is the primary display of flight information (attitude, heading, altitude, speed, engine). Its layout follows a standard 'T' arrangement for quick scanning; consistency across aircraft reduces the chance of misreading."},
 {r:"46.58.12",q:"Explain what is meant by a gauge.",a:"A gauge is an analogue instrument showing a value on a dial (e.g. pressure, temperature). Gauges are read by pointer position against a scale; good gauges have clear markings and ranges so values are read quickly and correctly."},
 {r:"46.58.14",q:"Explain what is meant by an indicator.",a:"An indicator is a simple visual signal showing a condition or value — e.g. a light, flag or bar showing 'on/off', full/empty or a level. Indicators give immediate status feedback and are designed for fast, unambiguous reading."},
 {r:"46.58.16",q:"Explain what is meant by a switch.",a:"A switch is a control that turns a function on or off (or selects between states). Good switches are clearly labelled, give tactile/visual feedback of position, and are arranged to prevent operating the wrong one."},
 {r:"46.58.18",q:"Explain what is meant by a lever.",a:"A lever is a control moved through an arc or range (e.g. throttle, flap lever). It should have clear detents/positions, consistent movement direction, and feedback so the pilot knows exactly where it is set."},
 {r:"46.58.20",q:"Explain what is meant by a knob.",a:"A knob is a rotary control adjusted by turning (e.g. volume, tuning). It should give clear detents or clicks and feedback of position so the setting is accurate; consistent clockwise/anticlockwise behaviour reduces selection errors."}
]});
DATA.push(
{r:"46.60",t:"Lighting",s:"Ergonomics",cards:[
 {r:"46.60.2",q:"Explain what is meant by illumination.",a:"Illumination is the amount of light falling on a surface, measured in lux — determining how well instruments and the environment can be seen. Adequate, even illumination is essential for reading displays and avoiding eye strain in the cockpit."},
 {r:"46.60.4",q:"Explain what is meant by luminance.",a:"Luminance is the brightness of a surface or light source as perceived by the eye (cd/m²). Contrast between instrument luminance and its background affects readability; too little contrast makes displays hard to read, too much causes glare."},
 {r:"46.60.6",q:"Explain what is meant by glare.",a:"Glare is excessive or poorly controlled brightness that reduces visibility and causes eye strain — e.g. sun on instruments, bright displays at night, or reflections. Cockpit design uses shades, positioning and dimmable displays to minimise it."},
 {r:"46.60.8",q:"Explain what is meant by contrast.",a:"Contrast is the difference in brightness between an object (e.g. a pointer or digit) and its background. Sufficient contrast makes instruments readable quickly; low contrast (or glare) forces the eye to work harder and increases misreading risk."},
 {r:"46.60.10",q:"Explain what is meant by colour.",a:"Colour is used in cockpits to convey meaning (e.g. red for warnings/caution, green for normal) and to aid recognition. But colour vision degrades in low light, so colour must be backed by position/shape/symbol — never relied on alone."},
 {r:"46.60.12",q:"Explain what is meant by ambient light.",a:"Ambient light is the general surrounding light level in the environment (or cabin). Cockpit displays and lighting are designed to work across a range of ambient conditions — bright daylight to night — so instruments remain readable without dazzling the pilot."},
 {r:"46.60.14",q:"Explain what is meant by artificial light.",a:"Artificial light is human-made illumination (instrument backlighting, cabin and flood lights). In the cockpit it must be sufficient for reading yet controllable (dimmable) so it does not cause glare or destroy night vision — dim red light is often used at night."},
 {r:"46.60.16",q:"Explain what is meant by natural light.",a:"Natural light is daylight entering the cockpit through windows. It is useful for outside visual reference but varies greatly (and can cause glare or wash out displays); cockpit design manages it with shades and display contrast to keep instruments readable."},
 {r:"46.60.18",q:"Explain what is meant by a light source.",a:"A light source is anything that emits visible light — the sun, instrument backlighting, cabin lights or warning lamps. In the cockpit their placement, intensity and colour are designed to illuminate instruments clearly without glare or night-vision loss."},
 {r:"46.60.20",q:"Explain what is meant by a lux meter.",a:"A lux meter measures illumination (light level) in lux on a surface — used to verify that cockpit displays and work areas meet required lighting levels for safe, comfortable reading across different flight conditions."}
]},
{r:"46.62",t:"Cockpit layout",s:"Ergonomics",cards:[
 {r:"46.62.2",q:"Explain what is meant by a cockpit.",a:"The cockpit (flight deck) is the area where the flight crew controls and monitors the aircraft — its seat, controls, displays and systems. Its layout is designed ergonomically so all critical items are within reach, sight and scan order for safe operation."},
 {r:"46.62.4",q:"Explain what is meant by a control station.",a:"A control station is the pilot's position — seat and associated controls (yoke/lever, throttles, switches) from which they fly the aircraft. It is positioned for good visibility of instruments and outside, with all primary controls within easy reach."},
 {r:"46.62.6",q:"Explain what is meant by a display station.",a:"A display station is the arrangement of instruments and screens the pilot reads (primary flight displays, engine gauges, warning lights). It follows a standard scan order with critical information prominent, so readings are quick and unambiguous."},
 {r:"46.62.8",q:"Explain what is meant by a switch panel.",a:"A switch panel is the group of switches controlling electrical and other systems. Good panels group related functions logically, label clearly and give feedback of position — reducing the chance of operating the wrong switch."},
 {r:"46.62.10",q:"Explain what is meant by a gauge cluster.",a:"A gauge cluster is a grouped set of instruments (e.g. engine gauges) arranged for efficient scanning. Logical grouping and consistent placement let the pilot read related values quickly without hunting, reducing workload."},
 {r:"46.62.12",q:"Explain what is meant by an instrument cluster.",a:"An instrument cluster is the primary set of flight instruments (attitude, heading, altitude, speed) in a standard layout for rapid scanning. The conventional arrangement keeps critical flight data in predictable positions across aircraft."},
 {r:"46.62.14",q:"Explain what is meant by a control yoke.",a:"A control yoke is the steering wheel/handle used to command pitch and roll. It is positioned for comfortable, precise input within easy reach of the pilot, with clear feedback of its position."},
 {r:"46.62.16",q:"Explain what is meant by a throttle quadrant.",a:"A throttle quadrant is the control area (usually levers/knobs) for engine power and related settings. It is placed within easy reach of the pilot's hand, with clear detents and feedback so power settings are accurate."},
 {r:"46.62.18",q:"Explain what is meant by a seat position.",a:"Seat position is where the pilot sits relative to controls and displays — adjustable so that sight lines to instruments and outside, and reach to all controls, are correct for their body size. Correct positioning supports visibility, comfort and accurate control."},
 {r:"46.62.20",q:"Explain what is meant by a headrest.",a:"A headrest is the support at the top of the seat that positions and steadies the pilot's head/neck. Proper head support improves posture, reduces neck fatigue on long duties and helps maintain consistent sight lines to instruments."}
]});

var stage=document.getElementById('stage');
var card=document.getElementById('card');
var cardInner=document.getElementById('cardInner');
var topicList=document.getElementById('topicList');
var landing=document.getElementById('landing');
var cardsScreen=document.getElementById('cards');
var topicTitleEl=document.getElementById('topicTitle');
var counterEl=document.getElementById('counter');
var progressBar=document.getElementById('progressBar');

/* ---- theme ---- */
var theme=localStorage.getItem('atpl-theme')||'dark';
function applyTheme(){
  document.body.className=theme;
  var glyph=theme==='dark'?'\u2600\uFE0F':'\uD83C\uDF19';
  var btns=document.querySelectorAll('[aria-label="Toggle theme"]');
  for(var i=0;i<btns.length;i++){btns[i].textContent=glyph;}
}
function toggleTheme(){theme=(theme==='dark')?'light':'dark';localStorage.setItem('atpl-theme',theme);applyTheme();}
document.getElementById('themeBtn').onclick=toggleTheme;
document.getElementById('themeBtn2').onclick=toggleTheme;

/* ---- landing list ---- */
function buildLanding(){
  topicList.innerHTML='';
  var lastS=null;
  for(var i=0;i<DATA.length;i++){
    (function(i){
      var topic=DATA[i];
      if(topic.s!==lastS){var h=document.createElement('div');h.className='sect';h.textContent=topic.s;topicList.appendChild(h);lastS=topic.s;}
      var row=document.createElement('div');row.className='row';
      row.innerHTML='<div class="badge">'+topic.r+'</div><div class="info"><div class="t">'+topic.t+'</div><div class="c">'+topic.cards.length+' cards</div></div><div class="chev">&#8250;</div>';
      row.onclick=function(){openTopic(i);};
      topicList.appendChild(row);
    })(i);
  }
}

/* ---- card rendering ---- */
var currentTopic=0,cardIdx=0,busy=false;
function renderCard(){
  var cur=DATA[currentTopic];var c=cur.cards[cardIdx];
  document.getElementById('frontRef').textContent=c.r;
  document.getElementById('backRef').textContent=c.r;
  document.getElementById('frontQ').textContent=c.q;
  document.getElementById('backA').textContent=c.a;
  topicTitleEl.textContent=cur.t;
  counterEl.textContent=(cardIdx+1)+' / '+cur.cards.length;
  progressBar.style.width=((cardIdx+1)/cur.cards.length*100)+'%';
  cardInner.classList.remove('flipped');
}
function openTopic(i){
  currentTopic=i;cardIdx=0;
  landing.classList.add('hidden');cardsScreen.classList.remove('hidden');
  renderCard();
  busy=true;
  card.style.transition='none';card.style.transform='translateY(28px)';card.style.opacity='0';
  requestAnimationFrame(function(){
    card.style.transition='transform .3s ease, opacity .3s ease';
    card.style.transform='translateY(0)';card.style.opacity='1';
    setTimeout(function(){busy=false;},320);
  });
}
function goHome(){
  cardsScreen.classList.add('hidden');landing.classList.remove('hidden');
  cardInner.classList.remove('flipped');
  card.style.transition='none';card.style.transform='translateY(0)';card.style.opacity='1';
}
document.getElementById('backBtn').onclick=goHome;

function flip(){cardInner.classList.toggle('flipped');}

/* ---- navigation with animation ---- */
function navigate(dir){
  if(busy)return;busy=true;
  var exitY=(dir==='up')?'-120%':'120%';
  var rot=(dir==='up')?-16:16;
  card.style.transition='transform .28s ease, opacity .28s ease';
  card.style.transform='translateY('+exitY+') rotateX('+rot+'deg)';
  card.style.opacity='0';
  setTimeout(function(){
    if(dir==='up'){if(cardIdx<DATA[currentTopic].cards.length-1)cardIdx++;}
    else{if(cardIdx>0)cardIdx--;}
    renderCard();
    var enterY=(dir==='up')?'120%':'-120%';
    card.style.transition='none';
    card.style.transform='translateY('+enterY+') rotateX('+(-rot)+'deg)';
    card.style.opacity='0';
    requestAnimationFrame(function(){
      card.style.transition='transform .28s ease, opacity .28s ease';
      card.style.transform='translateY(0) rotateX(0)';
      card.style.opacity='1';
      setTimeout(function(){busy=false;},60);
    });
  },270);
}

/* ---- swipe / tap (pointer events) ---- */
var sx=0,sy=0,dragging=false;
stage.addEventListener('pointerdown',function(e){
  if(busy)return;
  sx=e.clientX;sy=e.clientY;dragging=false;
  if(stage.setPointerCapture){stage.setPointerCapture(e.pointerId);}
});
stage.addEventListener('pointermove',function(e){
  if(busy)return;
  var dy=e.clientY-sy;
  if(!dragging && Math.abs(dy)>8){dragging=true;}
  if(dragging){
    card.style.transition='none';
    card.style.transform='translateY('+dy+'px) rotateX('+(dy*0.04)+'deg)';
  }
});
function endSwipe(e){
  if(busy)return;
  var dy=e.clientY-sy;
  if(!dragging){flip();return;}
  card.style.transition='transform .3s ease';
  if(dy<=-70){navigate('up');}
  else if(dy>=70){navigate('down');}
  else{card.style.transform='translateY(0) rotateX(0)';setTimeout(function(){card.style.transition='';},300);}
}
stage.addEventListener('pointerup',endSwipe);
stage.addEventListener('pointercancel',function(e){if(busy)return;card.style.transition='transform .3s ease';card.style.transform='translateY(0) rotateX(0)';});

/* ---- keyboard (desktop convenience) ---- */
window.addEventListener('keydown',function(e){
  if(cardsScreen.classList.contains('hidden'))return;
  if(e.key==='Escape'){goHome();}
  else if(e.key==='ArrowUp'||e.key==='ArrowRight'||e.key===' '){e.preventDefault();navigate('up');}
  else if(e.key==='ArrowDown'||e.key==='ArrowLeft'){e.preventDefault();navigate('down');}
});

/* ---- init ---- */
applyTheme();
buildLanding();
</script>
</body>
</html>
